; STM32 Sensor & Actuator Hub — see docs/BUILD_GUIDE.md Part 4.1 and 4.8
;
; Board (amended 2026-09-30, the two-box hub): an STM32F405RGT6 on the custom pod board in the
; windscreen pod. Before the PCB exists, bring-up uses any STM32F405RG development board with an
; 8 MHz crystal (BOM 1.1), wired to Config.h's pins. The F405 was chosen for its bxCAN controllers
; (OBD-II straight from the car's CAN bus; the F411 has none) and its hand-solderable LQFP64 package.
;
[platformio]
; `pio run` builds only the firmware target. The `native` env below is a host-side test harness,
; not something to cross-compile, and CI's firmware-build job runs a bare `pio run` (Part 13.5).
default_envs = stm32f4_hub

[env:stm32f4_hub]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
lib_deps =
    ; NOT the bare "FreeRTOS" the guide's Part 4.1 snippet lists — that resolves to feilipu's
    ; Arduino_FreeRTOS_Library, which is AVR-only and fails immediately on <avr/io.h>. The STM32
    ; port below exposes the same native FreeRTOS API the guide's Part 4.3 uses directly
    ; (xTaskCreate / vTaskStartScheduler), not a CMSIS-RTOS wrapper around it.
    ; See docs/decisions.md.
    stm32duino/STM32duino FreeRTOS@^10.3.3
    adafruit/Adafruit BNO08x
    mikalhart/TinyGPSPlus
    adafruit/Adafruit APDS9960 Library
monitor_speed = 115200
; PIO_FRAMEWORK_ARDUINO_ENABLE_CDC makes `Serial` the USB virtual serial port (the Part 3 link).
; The earlier -DUSB_CDC_ON_BOOT=1 is an ESP32 flag that STM32duino ignores: that firmware had no USB
; stack at all, and `Serial` was a hardware UART (found 2026-09-30, docs/decisions.md).
; HSE_VALUE must match the pod's crystal (src/SystemClock.cpp). This board definition carries no USB
; IDs, so the core's USB descriptor falls back to ST's own vendor ID (0x0483).
; HAL_CAN_MODULE_ENABLED: STM32duino compiles the bxCAN HAL only on request (src/drivers/ObdDriverCan.cpp).
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D HSE_VALUE=8000000U
    -D HAL_CAN_MODULE_ENABLED

; Bench build (Part 13.3): the same firmware, plus BENCH_TELEMETRY frames (actuator current,
; applied duty, load cell) for tools/bench_rig/log_actuator_bench.py. Never flash it to the car.
;   pio run -e bench -t upload
[env:bench]
extends = env:stm32f4_hub
build_flags = ${env:stm32f4_hub.build_flags} -DHUB_BENCH_TELEMETRY

; Pre-CAN vehicle fallback (Part 4.8.5): OBD-II through an ELM327 on USART3 instead of the car's
; CAN bus. Only if the test vehicle turns out to use K-line.
;   pio run -e hub_elm327 -t upload
[env:hub_elm327]
extends = env:stm32f4_hub
build_flags = ${env:stm32f4_hub.build_flags} -DHUB_OBD_ELM327

; Host-side test environment — runs `test/` on this machine with no STM32 board attached.
;
; Part 14 Phase 1's exit criteria accept "a matching firmware-side test (or a manual serial
; round-trip against known byte vectors)". This env is the automatable half: it compiles the
; FIRMWARE's own copy of Protocol.h and Crc16.h and asserts the same vectors the host's GoogleTest
; suite asserts, so both copies are independently confirmed rather than assumed identical.
;
; build_src_filter excludes src/ because that is Arduino/STM32 code which cannot build natively —
; only test/ and the headers under include/ are compiled here.
;
; Run with:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -I include
