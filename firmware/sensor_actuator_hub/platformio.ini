; STM32 Sensor & Actuator Hub — see docs/BUILD_GUIDE.md Part 4.1
;
; The board below is a placeholder until the exact F4 board on hand is confirmed (Part 4.1 allows
; any STM32F4 with >=2 I2C, >=2 UART, a spare UART/CAN for OBD-II, and enough timer channels for
; PWM actuator control). Record the board actually used in docs/decisions.md when it is fixed.

[env:stm32f4_hub]
platform = ststm32
board = blackpill_f411ce
framework = arduino
lib_deps =
    ; NOT the bare "FreeRTOS" the guide's Part 4.1 snippet lists — that resolves to feilipu's
    ; Arduino_FreeRTOS_Library, which is AVR-only and fails immediately on <avr/io.h>. The STM32
    ; port below exposes the same native FreeRTOS API the guide's Part 4.3 uses directly
    ; (xTaskCreate / vTaskStartScheduler), not a CMSIS-RTOS wrapper around it.
    ; See docs/decisions.md.
    stm32duino/STM32duino FreeRTOS@^10.3.3
    adafruit/Adafruit BNO08x
    mikalhart/TinyGPSPlus
monitor_speed = 115200
build_flags = -DUSB_CDC_ON_BOOT=1
