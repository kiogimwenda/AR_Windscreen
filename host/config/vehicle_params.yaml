# Vehicle geometry and host<->hub link parameters — see docs/BUILD_GUIDE.md Appendix A.
# Measured against the actual test vehicle during Phase 14; values below are placeholders.
wheelbase_m: 2.6
camera_height_m: 1.3
obd_pid_brake_active: ""      # fill in if the target vehicle exposes this PID; else leave blank
serial_device: "/dev/ttyACM0"
serial_baud: 115200
front_bumper_from_rear_axle_m: 3.5   # rear-axle reference point to the front bumper; the time-to-
                                      # collision gap is measured from the bumper (Part 9.3)
half_width_m: 0.9                     # half the body width, for the ego path corridor
