<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" font-family="Liberation Serif, Times New Roman, serif" fill="#000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern></defs>
<rect x="70.0" y="20.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="44.0" font-size="13" font-weight="bold" text-anchor="middle">Capture frame</text>
<text x="230.0" y="60.0" font-size="11" text-anchor="middle">2560 x 1440 BGR, timestamped</text>
<rect x="70.0" y="100.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="124.0" font-size="13" font-weight="bold" text-anchor="middle">Pre-process on the GPU</text>
<text x="230.0" y="140.0" font-size="11" text-anchor="middle">letterbox, normalise (CUDA)</text>
<rect x="70.0" y="180.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="204.0" font-size="13" font-weight="bold" text-anchor="middle">Four TensorRT engines</text>
<text x="230.0" y="220.0" font-size="11" text-anchor="middle">objects+masks, signs, lanes, depth</text>
<rect x="70.0" y="260.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="284.0" font-size="13" font-weight="bold" text-anchor="middle">Decode</text>
<text x="230.0" y="300.0" font-size="11" text-anchor="middle">boxes, masks, lane points, depth</text>
<rect x="70.0" y="340.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="364.0" font-size="13" font-weight="bold" text-anchor="middle">Project LiDAR into the image</text>
<text x="230.0" y="380.0" font-size="11" text-anchor="middle">motion-compensated, depth-tested</text>
<rect x="70.0" y="420.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="444.0" font-size="13" font-weight="bold" text-anchor="middle">Assign points by eroded mask</text>
<text x="230.0" y="460.0" font-size="11" text-anchor="middle">nearest dominant depth cluster</text>
<rect x="70.0" y="500.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="524.0" font-size="13" font-weight="bold" text-anchor="middle">Update IMM tracks</text>
<text x="230.0" y="540.0" font-size="11" text-anchor="middle">world frame, gated assignment</text>
<rect x="70.0" y="580.0" width="320.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="230.0" y="604.0" font-size="13" font-weight="bold" text-anchor="middle">Predict and assess risk</text>
<text x="230.0" y="620.0" font-size="11" text-anchor="middle">CPA, TTC, hazard flags</text>
<path d="M 230.0 76.0 L 230.0 100.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 230.0 156.0 L 230.0 180.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 230.0 236.0 L 230.0 260.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 230.0 316.0 L 230.0 340.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 230.0 396.0 L 230.0 420.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 230.0 476.0 L 230.0 500.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 230.0 556.0 L 230.0 580.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="430.0" y="500.0" width="250.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="555.0" y="524.0" font-size="13" font-weight="bold" text-anchor="middle">Sensor fusion (EKF)</text>
<text x="555.0" y="540.0" font-size="11" text-anchor="middle">GNSS, IMU, OBD speed: ego pose</text>
<path d="M 430.0 528.0 L 390.0 528.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="430.0" y="340.0" width="250.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="555.0" y="364.0" font-size="13" font-weight="bold" text-anchor="middle">LiDAR point cloud</text>
<text x="555.0" y="380.0" font-size="11" text-anchor="middle">10 Hz, ground plane fitted</text>
<path d="M 430.0 368.0 L 390.0 368.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="430.0" y="580.0" width="250.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="555.0" y="604.0" font-size="13" font-weight="bold" text-anchor="middle">To renderer and arbiter</text>
<text x="555.0" y="620.0" font-size="11" text-anchor="middle">hazards, overlays, requests</text>
<path d="M 390.0 608.0 L 430.0 608.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="20.0" y="680.0" font-size="11" font-style="italic" text-anchor="start">Measured: the four models together take a median 17.8 ms per frame (p95 19.9 ms) against a 33 ms budget.</text>
</svg>
