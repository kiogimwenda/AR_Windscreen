<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Liberation Serif, Times New Roman, serif" fill="#000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern></defs>
<rect x="40.0" y="170.0" width="170.0" height="80.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="125.0" y="200.0" font-size="13" font-weight="bold" text-anchor="middle">DISARMED</text>
<text x="125.0" y="216.0" font-size="11" text-anchor="middle">released, relays off,</text>
<text x="125.0" y="229.0" font-size="11" text-anchor="middle">command forgotten</text>
<rect x="300.0" y="30.0" width="170.0" height="80.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="385.0" y="60.0" font-size="13" font-weight="bold" text-anchor="middle">ARMED</text>
<text x="385.0" y="76.0" font-size="11" text-anchor="middle">commands may act</text>
<text x="385.0" y="89.0" font-size="11" text-anchor="middle">(clamped, &lt;= 1.5 s)</text>
<rect x="300.0" y="330.0" width="170.0" height="80.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="385.0" y="360.0" font-size="13" font-weight="bold" text-anchor="middle">FAULT LATCHED</text>
<text x="385.0" y="376.0" font-size="11" text-anchor="middle">overcurrent: only a</text>
<text x="385.0" y="389.0" font-size="11" text-anchor="middle">power cycle clears it</text>
<rect x="520.0" y="170.0" width="180.0" height="80.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="610.0" y="200.0" font-size="13" font-weight="bold" text-anchor="middle">Hardware release</text>
<text x="610.0" y="216.0" font-size="11" text-anchor="middle">watchdog task, no mutex;</text>
<text x="610.0" y="229.0" font-size="11" text-anchor="middle">IWDG reset at 500 ms</text>
<path d="M 210.0 190.0 L 300.0 80.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="150.0" y="118.0" font-size="11" font-style="italic" text-anchor="start">fresh HEARTBEAT while</text>
<text x="150.0" y="132.0" font-size="11" font-style="italic" text-anchor="start">all conditions hold</text>
<path d="M 300.0 95.0 L 215.0 210.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="262.0" y="172.0" font-size="11" font-style="italic" text-anchor="start">link lost &gt; 200 ms, report</text>
<text x="262.0" y="186.0" font-size="11" font-style="italic" text-anchor="start">loop stalled, E-stop, frame errors,</text>
<text x="262.0" y="200.0" font-size="11" font-style="italic" text-anchor="start">power box unplugged</text>
<path d="M 385.0 110.0 L 385.0 330.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="392.0" y="250.0" font-size="11" font-style="italic" text-anchor="start">current &gt; limit for 30 ms</text>
<path d="M 300.0 370.0 L 125.0 370.0 L 125.0 250.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 470.0 70.0 L 610.0 70.0 L 610.0 170.0" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<text x="490.0" y="62.0" font-size="11" font-style="italic" text-anchor="start">independent check every 20 ms</text>
<text x="40.0" y="450.0" font-size="11" font-style="italic" text-anchor="start">At boot the hub is DISARMED with the actuator released before any task runs.</text>
</svg>
