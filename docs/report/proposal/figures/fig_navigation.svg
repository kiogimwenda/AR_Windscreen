<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Liberation Serif, Times New Roman, serif" fill="#000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern></defs>
<rect x="20.0" y="10.0" width="680.0" height="110.0" rx="7" fill="none" stroke="#000" stroke-width="2"/>
<text x="34.0" y="32.0" font-size="13" font-weight="bold" text-anchor="start">Road status: three layers (the map is an expectation; the sensors are the truth)</text>
<rect x="34.0" y="40.0" width="206.0" height="66.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="137.0" y="63.0" font-size="12" font-weight="bold" text-anchor="middle">1  Base map</text>
<text x="137.0" y="79.0" font-size="10" text-anchor="middle">OpenStreetMap, 100 km</text>
<text x="137.0" y="92.0" font-size="10" text-anchor="middle">radius, refreshed nightly</text>
<rect x="256.0" y="40.0" width="206.0" height="66.0" rx="6" fill="none" stroke="#000" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="359.0" y="63.0" font-size="12" font-weight="bold" text-anchor="middle">2  Live network</text>
<text x="359.0" y="79.0" font-size="10" text-anchor="middle">traffic and incidents;</text>
<text x="359.0" y="92.0" font-size="10" text-anchor="middle">deferred (licence terms)</text>
<rect x="478.0" y="40.0" width="206.0" height="66.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="581.0" y="63.0" font-size="12" font-weight="bold" text-anchor="middle">3  Own sensors</text>
<text x="581.0" y="79.0" font-size="10" text-anchor="middle">closures, potholes;</text>
<text x="581.0" y="92.0" font-size="10" text-anchor="middle">override the map</text>
<rect x="40.0" y="170.0" width="180.0" height="60.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="130.0" y="196.0" font-size="13" font-weight="bold" text-anchor="middle">OSRM (MLD)</text>
<text x="130.0" y="212.0" font-size="11" text-anchor="middle">route + geometry</text>
<rect x="270.0" y="170.0" width="180.0" height="60.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="360.0" y="196.0" font-size="13" font-weight="bold" text-anchor="middle">Map matcher</text>
<text x="360.0" y="212.0" font-size="11" text-anchor="middle">HMM over a GNSS trace</text>
<rect x="500.0" y="170.0" width="180.0" height="60.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="590.0" y="196.0" font-size="13" font-weight="bold" text-anchor="middle">EKF pose</text>
<text x="590.0" y="212.0" font-size="11" text-anchor="middle">local tangent plane</text>
<rect x="160.0" y="290.0" width="400.0" height="70.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="360.0" y="315.0" font-size="13" font-weight="bold" text-anchor="middle">Road surface projector</text>
<text x="360.0" y="331.0" font-size="11" text-anchor="middle">route in the vehicle frame; lanes correct heading and</text>
<text x="360.0" y="344.0" font-size="11" text-anchor="middle">lateral offset; heights from the LiDAR ground patch</text>
<rect x="160.0" y="410.0" width="400.0" height="60.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="360.0" y="436.0" font-size="13" font-weight="bold" text-anchor="middle">AR route band</text>
<text x="360.0" y="452.0" font-size="11" text-anchor="middle">measured surface solid; far field fainter</text>
<path d="M 130.0 120.0 L 130.0 170.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 220.0 200.0 L 270.0 200.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 500.0 200.0 L 450.0 200.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 360.0 230.0 L 360.0 290.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="368.0" y="262.0" font-size="11" font-style="italic" text-anchor="start">progress along the route</text>
<path d="M 130.0 230.0 L 130.0 325.0 L 160.0 325.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 590.0 230.0 L 590.0 325.0 L 560.0 325.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M 360.0 360.0 L 360.0 410.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="20.0" y="500.0" font-size="11" font-style="italic" text-anchor="start">Measured on a recorded Nairobi drive (2,773 GNSS fixes): median snap distance 3.1 m; 98.7 % of fixes within 20 m.</text>
