<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Liberation Serif, Times New Roman, serif" fill="#000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern></defs>
<rect x="55.0" y="14.0" width="290.0" height="52.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="200.0" y="36.0" font-size="13" font-weight="bold" text-anchor="middle">Requirements and safety rules</text>
<text x="200.0" y="52.0" font-size="11" text-anchor="middle">hard actuation rule, scope, metrics</text>
<rect x="55.0" y="90.0" width="290.0" height="52.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="200.0" y="112.0" font-size="13" font-weight="bold" text-anchor="middle">Architecture and interfaces</text>
<text x="200.0" y="128.0" font-size="11" text-anchor="middle">protocol, message bus, DisplaySink</text>
<rect x="55.0" y="166.0" width="290.0" height="52.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="200.0" y="188.0" font-size="13" font-weight="bold" text-anchor="middle">Phase n: design</text>
<text x="200.0" y="204.0" font-size="11" text-anchor="middle">concept first, then interface</text>
<rect x="55.0" y="242.0" width="290.0" height="52.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="200.0" y="264.0" font-size="13" font-weight="bold" text-anchor="middle">Implement</text>
<text x="200.0" y="280.0" font-size="11" text-anchor="middle">C++17 host / FreeRTOS firmware</text>
<rect x="55.0" y="318.0" width="290.0" height="52.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="200.0" y="340.0" font-size="13" font-weight="bold" text-anchor="middle">Test</text>
<text x="200.0" y="356.0" font-size="11" text-anchor="middle">unit tests, sanitizers, fuzzing</text>
