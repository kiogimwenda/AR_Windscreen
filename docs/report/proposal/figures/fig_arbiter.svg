<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Liberation Serif, Times New Roman, serif" fill="#000"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern></defs>
<rect x="90.0" y="10.0" width="300.0" height="50.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="240.0" y="31.0" font-size="13" font-weight="bold" text-anchor="middle">Every cycle</text>
<text x="240.0" y="47.0" font-size="11" text-anchor="middle">tracks, ego state, hub state</text>
<polygon points="240,70.0 405.0,135 240,200.0 75.0,135" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="240.0" y="118.2" font-size="11" text-anchor="middle">Confirmed, LiDAR-ranged object</text>
<text x="240.0" y="132.0" font-size="11" text-anchor="middle">in the ego path with</text>
<text x="240.0" y="145.7" font-size="11" text-anchor="middle">TTC &lt; 1.8 s, pedal not pressed,</text>
<text x="240.0" y="159.5" font-size="11" text-anchor="middle">and the system ARMED?</text>
<path d="M 240.0 60.0 L 240.0 70.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="480.0" y="100.0" width="220.0" height="70.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="590.0" y="125.0" font-size="13" font-weight="bold" text-anchor="middle">Rule 1: BRAKE</text>
<text x="590.0" y="141.0" font-size="11" text-anchor="middle">intensity clamped (&lt;= 90);</text>
<text x="590.0" y="154.0" font-size="11" text-anchor="middle">logged with its context</text>
<path d="M 405.0 135.0 L 480.0 135.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="415.0" y="127.0" font-size="11" font-style="italic" text-anchor="start">Yes</text>
<polygon points="240,240.0 390.0,290 240,340.0 90.0,290" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="240.0" y="286.7" font-size="12" text-anchor="middle">Ego deceleration</text>
<text x="240.0" y="301.7" font-size="12" text-anchor="middle">above 0.4 g?</text>
<path d="M 240.0 200.0 L 240.0 240.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="248.0" y="215.0" font-size="11" font-style="italic" text-anchor="start">No</text>
<rect x="480.0" y="260.0" width="220.0" height="60.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="590.0" y="286.0" font-size="13" font-weight="bold" text-anchor="middle">Rule 2: HAZARDS</text>
<text x="590.0" y="302.0" font-size="11" text-anchor="middle">hazard lights on</text>
<path d="M 390.0 290.0 L 480.0 290.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="400.0" y="282.0" font-size="11" font-style="italic" text-anchor="start">Yes</text>
<polygon points="240,375.0 400.0,430 240,485.0 80.0,430" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="240.0" y="420.1" font-size="11" text-anchor="middle">HIGH or CRITICAL hazard</text>
<text x="240.0" y="433.9" font-size="11" text-anchor="middle">(reckless driving, crossing,</text>
<text x="240.0" y="447.6" font-size="11" text-anchor="middle">vulnerable user) in the path?</text>
<path d="M 240.0 340.0 L 240.0 375.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="248.0" y="356.0" font-size="11" font-style="italic" text-anchor="start">No</text>
<rect x="480.0" y="395.0" width="220.0" height="70.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="590.0" y="420.0" font-size="13" font-weight="bold" text-anchor="middle">Rule 3: WARNING</text>
<text x="590.0" y="436.0" font-size="11" text-anchor="middle">overlay + tone only;</text>
<text x="590.0" y="449.0" font-size="11" text-anchor="middle">never actuates</text>
<path d="M 400.0 430.0 L 480.0 430.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="410.0" y="422.0" font-size="11" font-style="italic" text-anchor="start">Yes</text>
<rect x="90.0" y="545.0" width="300.0" height="56.0" rx="6" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="240.0" y="569.0" font-size="13" font-weight="bold" text-anchor="middle">Rule 4: no request</text>
<text x="240.0" y="585.0" font-size="11" text-anchor="middle">a zeroed command (releases)</text>
<path d="M 240.0 485.0 L 240.0 545.0" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="248.0" y="504.0" font-size="11" font-style="italic" text-anchor="start">No</text>
<text x="20.0" y="628.0" font-size="11" font-style="italic" text-anchor="start">Predictions, collision probabilities, signs and map data never reach rule 1; they drive warnings only.</text>
</svg>
